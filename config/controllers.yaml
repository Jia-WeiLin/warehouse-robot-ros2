controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - left_wheel_joint
    right_wheel_names:
      - right_wheel_joint
    wheel_separation: 0.58
    wheel_radius: 0.15
    use_stamped_vel: false